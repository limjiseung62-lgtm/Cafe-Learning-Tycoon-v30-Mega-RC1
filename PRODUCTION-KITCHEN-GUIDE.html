<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 카페 저장·주방 안내</title><main style="max-width:680px;margin:30px auto;font:18px/1.7 system-ui;padding:20px"><h1>하나의 카페를 계속 키워요</h1><p>학습을 바꿔도 카페·현금·직원·가구는 유지해요. 학습 기록은 과목·범위별로 보관해요.</p><p>내 기록 저장하기를 누른 뒤 Chrome 다운로드에서 실제 JSON 파일을 확인하세요. 다음에는 저장한 기록 불러오기에서 파일을 골라 확인 후 복원하세요.</p><p>문제를 맞히면 현재 주방 단계만큼 해금 메뉴를 생산하고 창고 한도까지만 보관해요. 주방·창고 강화는 직접 비용을 지불하는 선택입니다.</p><a href="./">내 카페로</a></main>
